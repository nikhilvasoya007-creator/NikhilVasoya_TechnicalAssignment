{% extends "base.html" %}
{% block content %}
<h2>{{ 'Edit Product' if product else 'Add Product' }}</h2>
<form method="post">
  <label>Product Code <input type="text" name="product_code" value="{{ product.product_code if product else '' }}" required></label><br><br>
  <label>Name <input type="text" name="name" value="{{ product.name if product else '' }}" required></label><br><br>
  <label>Category <input type="text" name="category" value="{{ product.category if product else '' }}" required></label><br><br>
  <label>Price <input type="number" step="0.01" min="0" name="price" value="{{ product.price if product else '' }}" required></label><br><br>
  <label>Stock <input type="number" min="0" name="stock_quantity" value="{{ product.stock_quantity if product else '' }}" required></label><br><br>
  <button type="submit">Save</button>
  <a href="/products">Cancel</a>
</form>
{% endblock %}
